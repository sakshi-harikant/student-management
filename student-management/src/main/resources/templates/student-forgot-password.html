<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery - Studora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F4F7F4; }
        
        /* Matching your Studora brand layout style */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #D8F3DC, #B7EFC5);
            width: 52px;
            height: 52px;
            border-radius: 14px;
            position: relative;
        }
        .logo-wrapper .logo-icon {
            font-size: 1.5rem;
            color: #1B4332;
        }
        .logo-wrapper .logo-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #40916C;
            border-radius: 50%;
            bottom: 6px;
            right: 6px;
            border: 2px solid white;
        }
        .brand-text {
            background: linear-gradient(135deg, #2D6A4F, #40916C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- Home Button on top right -->
    <div class="absolute top-6 right-6 z-50">
        <a th:href="@{/}" class="text-sm font-bold text-gray-600 hover:text-[#2D6A4F] transition flex items-center gap-2 bg-white/80 backdrop-blur shadow-sm px-5 py-2.5 rounded-xl border border-gray-100 hover:border-[#40916C]">
            <i data-lucide="home" class="w-4 h-4 text-[#2D6A4F]"></i> Home
        </a>
    </div>

    <!-- Recovery Card Container -->
    <div class="w-full max-w-md bg-white border border-gray-100 rounded-2xl p-8 shadow-sm">
        
        <!-- Brand Header Logo -->
        <div class="flex flex-col items-center justify-center mb-8 text-center">
            <div class="logo-wrapper mb-4">
                <i class="fas fa-book-open logo-icon"></i>
                <span class="logo-dot"></span>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Account Recovery</h2>
            <p class="text-sm text-gray-500 mt-1">Verify your academic profile to reset your password</p>
        </div>

        <!-- Dynamic Error Feedback Message Box -->
        <div th:if="${error}" class="mb-5 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl flex items-center gap-2 font-medium">
            <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 text-red-600"></i>
            <span th:text="${error}">Error details text wrapper</span>
        </div>

        <!-- Verification Reset Form Mapping -->
        <form th:action="@{/student/forgot-password}" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Student ID</label>
                <input type="text" name="studentId" required placeholder="e.g. STU-101" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#40916C] focus:ring-1 focus:ring-[#40916C] text-sm transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Registered Email Address</label>
                <input type="email" name="email" required placeholder="Enter your profile email" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#40916C] focus:ring-1 focus:ring-[#40916C] text-sm transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Choose New Password</label>
                <input type="password" name="newPassword" required placeholder="••••••••" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#40916C] focus:ring-1 focus:ring-[#40916C] text-sm transition">
            </div>

            <button type="submit" class="w-full bg-[#40916C] text-white py-3.5 rounded-xl font-semibold hover:bg-[#2D6A4F] transition shadow-sm mt-2 text-base">
                Verify Profile & Reset
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a th:href="@{/student/login}" class="text-[#2D6A4F] font-bold hover:underline">
                Back to Login screen
            </a>
        </div>
    </div>

    <!-- Font Awesome Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Lucide Icon Trigger -->
    <script>lucide.createIcons();</script>
</body>
</html>
