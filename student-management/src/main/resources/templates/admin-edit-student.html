<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student Profile - Studora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FCFA; }
        .bg-studora { background-color: #1E4D38; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
        <div class="mb-6 flex justify-between items-center pb-4 border-b border-gray-50">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Modify Student Profile</h2>
                <p class="text-sm text-gray-500 mt-0.5" th:text="'Modifying Record ID: ' + ${student.studentId}">Modify details below.</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="text-xs font-semibold text-gray-500 bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-100 hover:bg-gray-100">
                Cancel
            </a>
        </div>

        <form th:action="@{/admin/student/update}" th:object="${student}" method="POST" class="space-y-5">
            <input type="hidden" name="id" th:value="${student.id}" />
            <input type="hidden" name="studentId" th:value="${student.studentId}" />

            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Full Name</label>
                    <input type="text" name="fullName" th:value="${student.fullName}" required class="w-full px-4 py-2 rounded-xl border text-sm focus:outline-none focus:border-green-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Primary Email</label>
                    <input type="email" name="email" th:value="${student.email}" required class="w-full px-4 py-2 rounded-xl border text-sm focus:outline-none focus:border-green-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Department</label>
                    <input type="text" name="department" th:value="${student.department}" required class="w-full px-4 py-2 rounded-xl border text-sm focus:outline-none focus:border-green-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Course Degree</label>
                    <input type="text" name="course" th:value="${student.course}" required class="w-full px-4 py-2 rounded-xl border text-sm focus:outline-none focus:border-green-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Phone Number</label>
                    <input type="text" name="phone" th:value="${student.phone}" required class="w-full px-4 py-2 rounded-xl border text-sm focus:outline-none focus:border-green-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Account Status</label>
                    <select name="status" class="w-full px-4 py-2 rounded-xl border text-sm focus:outline-none focus:border-green-600">
                        <option value="Active" th:selected="${student.status == 'Active'}">Active</option>
                        <option value="Suspended" th:selected="${student.status == 'Suspended'}">Suspended</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-gray-600 mb-1">System Username Reference</label>
                    <input type="text" name="username" th:value="${student.username}" required class="w-full px-4 py-2 rounded-xl border text-sm focus:outline-none focus:border-green-600">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-800 text-white py-2.5 rounded-xl font-semibold hover:bg-emerald-900 transition shadow-sm mt-4">
                Commit Changes & Propagate Metrics
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
